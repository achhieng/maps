<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAPS — Maps Archiving Political Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;0,800;0,900;1,700;1,800&family=Anton&family=Oswald:wght@400;600;700&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Libre+Franklin:wght@400;500;600;700;800;900&family=Fraunces:opsz,wght@9..144,700;9..144,800;9..144,900&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Spectral+SC:wght@500;700&display=swap">
<style>
:root{--r:8px;--fs:14px}
body[data-theme="strategy"]{--bg:#121518;--bg2:#181c20;--panel:#1f2429;--panel2:#262c32;--line:#3c3426;--line2:#2f353c;--text:#e9e3d2;--muted:#a59f8f;--acc:#c9a04a;--acc2:#e6b43c;--accT:#1a1408;--inp:#15191d;--hover:#2c333a;--shadow:0 2px 0 #0006,inset 0 1px 0 #ffffff0d;--head:"Spectral SC",Georgia,serif;
  background-image:radial-gradient(ellipse at top,#1d2328 0,#121518 70%),repeating-linear-gradient(45deg,#ffffff03 0 2px,transparent 2px 6px)}
body[data-theme="dark"]{--bg:#111316;--bg2:#16191d;--panel:#1b1f24;--panel2:#22272d;--line:#2d333a;--line2:#2d333a;--text:#e6e8eb;--muted:#9aa3ad;--acc:#5b9cff;--acc2:#7cb1ff;--accT:#fff;--inp:#121518;--hover:#262c33;--shadow:0 1px 2px #0005;--head:Inter,sans-serif}
body[data-theme="light"]{--bg:#f3f4f6;--bg2:#eceef1;--panel:#ffffff;--panel2:#f7f8fa;--line:#dde1e6;--line2:#e6e9ed;--text:#1f2328;--muted:#646d78;--acc:#2a63d4;--acc2:#2a63d4;--accT:#fff;--inp:#fff;--hover:#eef1f5;--shadow:0 1px 2px #0000000f;--head:Inter,sans-serif}
body[data-theme="wiki"]{--bg:#f6f6f6;--bg2:#eaecf0;--panel:#ffffff;--panel2:#f8f9fa;--line:#a2a9b1;--line2:#c8ccd1;--text:#202122;--muted:#54595d;--acc:#3366cc;--acc2:#3366cc;--accT:#fff;--inp:#fff;--hover:#eaf3ff;--shadow:none;--head:"Source Serif 4",Georgia,serif;--r:2px}
body[data-theme="archive"]{--bg:#e8dfca;--bg2:#ded3b9;--panel:#f6efdc;--panel2:#efe6cf;--line:#c4b48e;--line2:#d3c6a6;--text:#3a2f1e;--muted:#7a6a4e;--acc:#8b3a1a;--acc2:#a0461f;--accT:#fff;--inp:#fbf6e8;--hover:#ece2c7;--shadow:0 1px 0 #0000000d;--head:"Source Serif 4",Georgia,serif;background-image:repeating-linear-gradient(0deg,#0000000a 0 1px,transparent 1px 4px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background-color:var(--bg);color:var(--text);font:var(--fs)/1.45 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
#app{height:100%}
a{color:var(--acc2);cursor:pointer;text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--head);margin:0 0 .4em;font-weight:700;letter-spacing:.01em}
h1{font-size:26px}h2{font-size:20px}h3{font-size:17px}h4{font-size:14px;margin-top:18px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--text);background:var(--inp);border:1px solid var(--line2);border-radius:calc(var(--r) - 2px);padding:6px 8px;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
input[type=color]{padding:2px;width:40px;height:32px;cursor:pointer}
input[type=range]{padding:0;accent-color:var(--acc)}
input[type=checkbox]{accent-color:var(--acc);width:15px;height:15px}
textarea{width:100%;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:1px solid var(--acc);background:var(--acc);color:var(--accT);font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border-color:var(--line2)}
.btn.ghost:hover{background:var(--hover)}
.btn.primary{background:var(--acc2);border-color:var(--acc2)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.danger{background:#b3261e;border-color:#b3261e;color:#fff}
.danger-t{color:#e05a4f!important}
.iconbtn{background:transparent;border:1px solid transparent;border-radius:6px;min-width:28px;height:28px;cursor:pointer;color:var(--text);display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.iconbtn:hover{background:var(--hover);border-color:var(--line2)}.iconbtn.on{background:var(--acc);color:var(--accT)}.iconbtn.xs{min-width:20px;height:20px;font-size:11px}.iconbtn[disabled]{opacity:.35;pointer-events:none}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row.end{justify-content:flex-end;margin-top:14px}.row.center{justify-content:center}.row.wrap{flex-wrap:wrap}.col{display:flex;flex-direction:column;gap:6px}
.spacer{flex:1}.grow{flex:1}.muted{color:var(--muted)}.small{font-size:12px}.r{text-align:right}.c{text-align:center}.w40{width:40px}.w60{width:60px!important}.w70{width:76px!important}.w90{width:96px!important}.w110{width:110px!important}.w140{width:140px!important}.nowrap{white-space:nowrap}
.up{color:#1f9d55!important}.down{color:#e04b3f!important}
.chip{display:inline-flex;align-items:center;gap:5px;padding:1px 9px 1px 7px;border-radius:999px;background:color-mix(in srgb,var(--c,#888) 22%,transparent);border:1px solid color-mix(in srgb,var(--c,#888) 60%,transparent);font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c,#888)}
.btnchip{cursor:pointer}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;flex:none;font-style:normal;font-size:12px;line-height:12px;text-align:center}
.swbtn{width:22px;height:22px;border-radius:5px;border:2px solid #fff6;cursor:pointer}
/* layout */
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--bg2);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.logo{font-family:"Spectral SC",Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.18em;color:var(--acc2)}
.logo.sm{font-size:18px;cursor:pointer}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.modes{display:flex;gap:2px;margin-left:16px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:3px}
.modes button{border:0;background:transparent;padding:5px 14px;border-radius:calc(var(--r) - 2px);cursor:pointer;font-weight:600;font-size:13px;color:var(--muted)}
.modes button.on{background:var(--acc);color:var(--accT)}
.savestate{font-size:12px;color:var(--muted);margin-right:4px}
.body{display:grid;grid-template-columns:236px 1fr;height:calc(100% - 52px)}
.body.nosb{grid-template-columns:0 1fr}.body.nosb .sb{display:none}
.sb{background:var(--bg2);border-right:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;padding:10px 8px}
.sb-nation{display:flex;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);cursor:pointer;margin-bottom:10px}
.sb-nation img{width:46px;height:31px;object-fit:cover;border:1px solid #0006;border-radius:2px}
.sb-nation b{display:block;font-family:var(--head);font-size:14px}.sb-nation small{color:var(--muted);font-size:11px}
.sb-group{display:flex;flex-direction:column;gap:1px}
.sb a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:6px;color:var(--text);font-size:13.5px;text-decoration:none}
.sb a:hover{background:var(--hover)}.sb a.on{background:var(--panel2);box-shadow:inset 3px 0 var(--acc2);font-weight:600}
.ni{width:18px;text-align:center;color:var(--acc2);font-size:13px}
.sb-sub{margin:2px 0 8px 26px;border-left:1px solid var(--line2)}.sb-sub a{font-size:12px;padding:4px 10px;color:var(--muted)}
.sb-bottom{margin-top:auto;padding-top:10px;border-top:1px solid var(--line2)}
.main{overflow:auto;position:relative}
.page{padding:20px 24px 60px;max-width:1500px;margin:0 auto}.page.wide{max-width:none}.page.narrow{max-width:900px}
.page-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.page-head h1{margin:0}
.crumbs{font-size:12px;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px}
.pad{padding:16px 18px}.pad-s{padding:10px}
.ptitle{font-family:var(--head);font-size:14px;font-weight:700;letter-spacing:.04em;color:var(--acc2);margin:4px 0 10px;text-transform:uppercase}
.ptitle.row{display:flex}
.ptitle a{text-transform:none;letter-spacing:0}
body[data-theme="light"] .ptitle,body[data-theme="wiki"] .ptitle{color:var(--text)}
.split{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.list-panel{max-height:calc(100vh - 150px);overflow:auto;position:sticky;top:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.grid2.gap{gap:14px}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}.fld>span{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.02em}.fld small{color:var(--muted);font-size:11px}
.chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}.chk.big{padding-top:20px}.chk.xs{font-size:11.5px}
fieldset{border:1px solid var(--line2);border-radius:var(--r);margin:10px 0;padding:10px 14px}legend{font-weight:700;padding:0 6px;color:var(--acc2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin:-4px 0 14px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc2)}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;max-height:180px;overflow:auto;padding:6px;border:1px solid var(--line2);border-radius:6px}.checks.big{max-height:none}
.empty{text-align:center;padding:36px 20px;color:var(--muted)}.empty h3{color:var(--text)}.empty-ico{font-size:30px;color:var(--acc2);opacity:.6}.empty.small{padding:14px}
.plain{list-style:none;padding:0;margin:0}.plain li{padding:4px 0;border-bottom:1px dashed var(--line2)}
.plist{display:flex;flex-direction:column}.plist a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line2);color:var(--text);text-decoration:none}
.plist a:hover{background:var(--hover)}.plist a.on{background:var(--panel2);box-shadow:inset 3px 0 var(--acc2)}
.plist img{width:34px;height:34px;object-fit:cover;border-radius:6px;flex:none}.plist.pol img{height:42px;border-radius:4px}.plist span{flex:1;min-width:0}.plist b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.plist small{color:var(--muted);font-size:11.5px}.plist em{font-style:normal;font-weight:700;color:var(--acc2)}
.tree a{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line2);color:var(--text);text-decoration:none}.tree a.on{background:var(--panel2);box-shadow:inset 3px 0 var(--acc2)}.tree .lvl{font-size:10px;color:var(--muted);text-transform:uppercase;width:76px;flex:none}.tree a.abol{opacity:.55}
.party-head{display:flex;align-items:center;gap:14px;margin-bottom:14px;padding-bottom:12px;border-bottom:3px solid var(--c,var(--line2))}.party-head img{width:64px;height:64px;border-radius:10px;object-fit:cover}.party-head img.tall{height:80px;border-radius:6px}.party-head h2{margin:0}
.imgfld .imgbox{width:130px;height:110px;border:1px dashed var(--line2);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--panel2)}.imgfld .imgbox img{max-width:100%;max-height:100%}.imgfld .imgbox em{color:var(--muted);font-size:12px}
.pol-edit{display:grid;grid-template-columns:150px 1fr;gap:16px}
table{border-collapse:collapse}
.etable{width:100%;font-size:13px}.etable th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line2)}.etable td{padding:3px 4px;border-bottom:1px solid var(--line2)}.etable td input,.etable td select{width:100%}.etable tr.sub td{border-bottom:2px solid var(--line2);padding-bottom:6px}
.etable.list td{padding:8px 6px}.click{cursor:pointer}.click:hover{background:var(--hover)}
.seatstrip{display:flex;width:220px;height:14px;border-radius:3px;overflow:hidden;padding:0!important;margin:8px 0}.etable.list .seatstrip{display:table-cell}.seatstrip i{display:block;height:14px}
td.seatstrip{display:flex!important;border:0!important;margin-top:9px}
.infoline{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:8px 12px;margin:8px 0;font-size:13px}
.warnbox{background:#e8a3171f;border:1px solid #e8a31788;border-radius:6px;padding:8px 14px;margin:10px 0;font-size:13px}.warnbox ul{margin:4px 0 0;padding-left:18px}
.okbox{background:#1f9d551a;border:1px solid #1f9d5566;border-radius:6px;padding:8px 14px;margin:10px 0;font-size:13px}
.scroll-x{overflow-x:auto}
/* sheet */
.sheet{font-size:13px;min-width:100%}.sheet th{background:var(--panel2);font-size:11.5px;font-weight:700;padding:6px;border:1px solid var(--line2);white-space:nowrap;color:var(--muted)}.sheet td{border:1px solid var(--line2);padding:2px}
.sheet input,.sheet select{border:0;background:transparent;width:100%;padding:5px 6px;border-radius:0}.sheet select{min-width:150px}.sheet input.num{text-align:right;width:110px}.sheet input.num.s{width:64px}.sheet input.num.xs{width:62px}
.sheet td.calc{text-align:right;padding:5px 8px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}.calc.b{color:var(--text);font-weight:700;display:block;text-align:right;padding:5px 8px}
.sheet tfoot th{text-align:left;color:var(--text)}.sheet tfoot th.r{text-align:right}.sheet tfoot th.ok{color:#1f9d55}.sheet tfoot th.bad{color:#e04b3f}.sheet tfoot input{background:var(--inp)}
.tbar{margin-bottom:8px}
.results-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}.results-side{position:sticky;top:0;align-self:start}
.mini-parl svg{width:100%}.mini-donut{width:170px}
.sysdesc{background:var(--panel2);padding:10px 14px;border-left:3px solid var(--acc2);border-radius:4px}
.chart-box{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:8px;margin-bottom:10px}.chart-box svg{width:100%;height:auto;display:block}
/* welcome */
.welcome{min-height:100%;padding:40px 24px 60px;max-width:1150px;margin:0 auto}
.wl-hero{text-align:center;padding:30px 0 10px}.wl-emblem{width:260px;margin:0 auto -6px;opacity:.95}
.wl-logo{font-family:"Spectral SC",Georgia,serif;font-size:76px;letter-spacing:.3em;margin:0 0 0 .3em;color:var(--acc2);text-shadow:0 2px 0 #0007}
.wl-name{font-family:var(--head);font-size:18px;letter-spacing:.12em;text-transform:uppercase}.wl-tag{color:var(--muted);font-style:italic;font-family:"Source Serif 4",Georgia,serif;font-size:18px;margin:6px 0 26px}
.wl-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.bigbtn{width:230px;padding:18px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:var(--shadow)}.bigbtn:hover{border-color:var(--acc2);transform:translateY(-1px)}
.bigbtn b{font-size:26px;color:var(--acc2)}.bigbtn span{font-weight:700;font-size:15px}.bigbtn small{color:var(--muted)}.bigbtn.primary{border-color:var(--acc)}
.wl-section{margin-top:34px}.wl-section h2{border-bottom:1px solid var(--line);padding-bottom:6px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.proj-card{display:grid;grid-template-columns:96px 1fr;gap:6px 14px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}.proj-card.example{max-width:760px}
.proj-flag img{width:96px;height:64px;object-fit:cover;border:1px solid #0006;border-radius:3px;cursor:pointer}
.proj-body b{display:block;font-family:var(--head);font-size:17px;cursor:pointer}.proj-body small{display:block;color:var(--muted);font-size:12px}
.proj-actions{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.wl-foot{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
.boot{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted)}.boot .logo{font-size:48px}
/* wizard */
.wizard{max-width:980px;margin:0 auto;padding:24px}.wiz-head{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.wiz-steps{display:flex;gap:4px;list-style:none;padding:0;margin:0;flex-wrap:wrap}.wiz-steps li{flex:1;min-width:130px;display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);cursor:pointer;font-size:12.5px;color:var(--muted)}
.wiz-steps li b{width:22px;height:22px;border-radius:50%;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.wiz-steps li.on{border-color:var(--acc2);color:var(--text)}.wiz-steps li.on b{background:var(--acc2);color:var(--accT)}.wiz-steps li.done b{background:#1f9d55;color:#fff}
.wiz-steps.inline{margin-bottom:12px}
.wiz-body{padding:20px 22px}.wiz-foot{display:flex;gap:8px;margin-top:12px}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:14px}
.choice{text-align:left;padding:10px 12px;border:1px solid var(--line2);background:var(--panel2);border-radius:var(--r);cursor:pointer;display:flex;flex-direction:column;gap:3px}.choice small{color:var(--muted);font-size:11.5px;line-height:1.35}.choice.on{border-color:var(--acc2);box-shadow:inset 0 0 0 1px var(--acc2);background:color-mix(in srgb,var(--acc2) 14%,var(--panel2))}.choice.sm{padding:6px 10px;font-size:12.5px}
.flag-editor{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start;margin-bottom:10px}.flag-prev img{width:220px;aspect-ratio:3/2;object-fit:cover;border:1px solid #0006;box-shadow:0 2px 8px #0004}
.parl-mini{width:260px;margin:4px auto 0;color:var(--muted)}
/* dashboard */
.dash{padding:14px 16px 40px}
.dash-top{display:grid;grid-template-columns:auto 260px auto 1fr;align-items:center;gap:14px;padding:10px 14px}
.yearctl{display:flex;align-items:center;gap:4px}.yearbox{width:90px;font-family:"Spectral SC",Georgia,serif;font-size:22px;font-weight:700;text-align:center;padding:2px 4px;color:var(--acc2)}
.yrange{width:100%}.era-badge{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}.era-badge i{width:12px;height:12px;border-radius:3px}
.tl-wrap{min-width:0}.tl-mini{width:100%;height:54px;color:var(--text);cursor:crosshair;display:block}
.dash-grid{display:grid;grid-template-columns:minmax(330px,420px) 1fr;gap:14px}
.nat-head{display:flex;gap:12px;align-items:center;padding:12px}.nat-flag{width:96px;height:64px;object-fit:cover;border:1px solid #0008;box-shadow:0 2px 6px #0005}.nat-coa{width:52px;height:64px;object-fit:contain}.nat-head h2{font-size:18px;margin:0}.motto{font-style:italic;color:var(--muted);font-family:"Source Serif 4",Georgia,serif}.nat-head .muted{font-size:12px}
.leader{padding:12px 14px}.leader-body{display:grid;grid-template-columns:150px 1fr;gap:14px}
.leader-portrait{width:150px;height:188px;object-fit:cover;border:3px solid;border-radius:4px;box-shadow:0 4px 14px #0006;cursor:pointer;background:#0003}

.cmdk{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:4px;padding:4px 8px 4px 10px;cursor:pointer;font-size:12.5px;min-width:200px}

.cmd input:focus{outline:none}

@media (max-width:1300px){.brand-sub{display:none}.cmdk{min-width:0}.cmdk span,.cmdk kbd{display:none}}
/* ===================== start screen ===================== */
.home{max-width:1000px;margin:0 auto;padding:14px 20px 36px;color:#efe7d6;font-family:"Libre Franklin",Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column}
.home-bar{display:flex;gap:8px;align-items:center;font-size:12px;color:#9b9587;animation:fadeUp .4s both}
.hb-dot{width:8px;height:8px;border-radius:50%;background:#e3c995}.hb-dot.on{background:#5ad18a;box-shadow:0 0 8px #5ad18a}.hb-sp{flex:1}.hb-keys kbd{margin:0 3px 0 10px;color:#cfc6b2;border-color:#ffffff40}
.home-hero{text-align:center;padding:8vh 0 26px}
.home .home-title{font-family:Fraunces,"Source Serif 4",Georgia,serif;font-weight:900;font-size:clamp(100px,17vw,200px);line-height:.84;margin:0;letter-spacing:.05em;color:#f3ead6;text-shadow:0 8px 50px #000c}
.home-title span{display:inline-block;animation:dropIn .75s cubic-bezier(.2,.9,.3,1.25) both}
.home-title span:hover{color:#e3c995;transform:translateY(-4px);transition:.2s}
@keyframes dropIn{from{opacity:0;transform:translateY(-46px) rotate(-7deg)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.home-sub{text-transform:uppercase;letter-spacing:.32em;font-size:12.5px;font-weight:700;color:#cfc6b2;margin-top:14px;animation:fadeUp .5s both .3s}
.home-tag{font-family:"Source Serif 4",Georgia,serif;font-style:italic;font-size:17px;color:#a49d8e;margin-top:6px;animation:fadeUp .5s both .4s}.home-tag i{margin:0 10px;font-style:normal;color:#6f6a60}
.home-actions{display:grid;grid-template-columns:1.35fr 1.2fr 1fr 1fr;gap:10px;margin:6px auto 26px;width:100%;max-width:900px}
.ha{display:flex;align-items:center;gap:12px;padding:13px 15px;border-radius:12px;border:1px solid #ffffff26;background:#0e111bcc;backdrop-filter:blur(6px);color:#f3ead6;cursor:pointer;text-align:left;transition:transform .15s,border-color .15s,background .15s;animation:fadeUp .5s both .45s;font-family:inherit}
.ha:nth-child(2){animation-delay:.5s}.ha:nth-child(3){animation-delay:.55s}.ha:nth-child(4){animation-delay:.6s}
.ha:hover{transform:translateY(-2px);border-color:#e3c99599;background:#161b29ee}
.ha b{font-size:21px;color:#e3c995;width:24px;text-align:center;font-weight:400}.ha img{width:34px;height:23px;object-fit:cover;border-radius:2px;border:1px solid #0008}
.ha span{display:flex;flex-direction:column;font-weight:700;font-size:15px;line-height:1.2;min-width:0}.ha small{font-weight:500;font-size:11.5px;color:#9b9587;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ha.primary{background:#e3c995;border-color:#e3c995;color:#1c1a16;box-shadow:0 10px 40px #e3c99530}.ha.primary b{color:#1c1a16}.ha.primary small{color:#5d5440}.ha.primary:hover{background:#ecd6a8}
.home-lib{background:#0b0e17e0;border:1px solid #ffffff1c;border-radius:14px;padding:12px 12px 6px;backdrop-filter:blur(8px);animation:fadeUp .5s both .6s}
.hl-head{display:flex;align-items:center;gap:10px;margin:0 2px 8px}
.hl-head h2{font-family:Fraunces,Georgia,serif;font-size:19px;margin:0;color:#f3ead6;flex:none;font-weight:800}.hl-head h2 em{font:600 11.5px "Libre Franklin",sans-serif;color:#9b9587;border:1px solid #ffffff2a;border-radius:10px;padding:1px 7px;margin-left:6px;vertical-align:3px}
#homeQ{flex:1;background:#ffffff0d;border:1px solid #ffffff22;color:#f3ead6;border-radius:8px;padding:7px 10px;font-size:13px}#homeQ:focus{outline:none;border-color:#e3c995}
.hl-sort{display:flex;gap:2px}.hl-sort button{background:transparent;border:0;color:#9b9587;font:600 12px "Libre Franklin",sans-serif;padding:5px 9px;border-radius:6px;cursor:pointer}.hl-sort button.on{background:#ffffff16;color:#f3ead6}
.hl-list{display:flex;flex-direction:column;max-height:46vh;overflow:auto}
.hl-row{display:grid;grid-template-columns:44px minmax(0,1.4fr) 96px minmax(0,1.3fr) 84px 58px;align-items:center;gap:12px;padding:8px;border-radius:8px;cursor:pointer;animation:fadeUp .35s both;border-top:1px solid #ffffff0d}
.hl-row:first-child{border-top:0}.hl-row:hover{background:#ffffff0d}.hl-row:hover .hl-acts{opacity:1}
.hl-flag{width:44px;height:29px;object-fit:cover;border-radius:2px;border:1px solid #0009}
.hl-name{min-width:0}.hl-name b{display:block;font-size:15px;color:#f3ead6;font-family:Fraunces,Georgia,serif;font-weight:700}.hl-name small{display:block;font-size:11.5px;color:#9b9587;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-hemi svg{width:96px;height:auto;display:block}.hm-none{font-size:11px;color:#6f6a60}
.hl-stats{display:flex;gap:10px;font-size:12px;color:#9b9587;white-space:nowrap}.hl-stats b{color:#efe7d6}
.hl-time{font-size:12px;color:#9b9587;text-align:right;white-space:nowrap}
.hl-acts{opacity:0;display:flex;gap:4px;justify-content:flex-end;transition:opacity .15s}.hl-acts button{background:#ffffff14;border:0;color:#efe7d6;width:25px;height:25px;border-radius:6px;cursor:pointer}.hl-acts button:hover{background:#ffffff2a}.hl-acts button.red:hover{background:#b3261e}
.hl-empty{padding:18px;text-align:center;color:#9b9587;font-size:13px}
.home-foot{text-align:center;color:#7d786d;font-size:12px;margin-top:auto;padding-top:18px}
@media (max-width:820px){.home-actions{grid-template-columns:1fr 1fr}.hl-row{grid-template-columns:40px minmax(0,1fr) 70px 40px}.hl-hemi,.hl-stats{display:none}.hb-keys{display:none}}

.wk-root .wk-sbtn{background:var(--wk-ibg);color:var(--wk-fg);border-color:var(--wk-bd)}

.wk-root .wk-body.has-ap{grid-template-columns:var(--wk-toc) minmax(0,1fr) 172px}

.wk-root .wk-toc a{color:var(--wk-link);padding:4px 0 4px 12px;border-left:2px solid transparent}.wk-root .wk-toc a.ttop{color:var(--wk-fg);font-weight:700;padding-left:12px}.wk-root .wk-toc a:hover{text-decoration:underline}

.wk-inc{color:#00af00;font-size:.85em}.wk-dec{color:#dd3333;font-size:.85em}.wk-steady{color:#888;font-size:.8em}
